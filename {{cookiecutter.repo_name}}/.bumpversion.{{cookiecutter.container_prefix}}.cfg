[bumpversion]
current_version = 0.0.1
commit = True
tag = True
tag_name = {{cookiecutter.container_prefix}}-{new_version}
message = 🚀 DEPLOY: {{cookiecutter.container_prefix}}-{new_version} 배포

[bumpversion:file:app/domain/{{cookiecutter.container_prefix}}/version.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

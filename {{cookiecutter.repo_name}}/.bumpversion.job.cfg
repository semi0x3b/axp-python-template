# 서비스(배포 이미지)별 버전. 새 서비스 추가 시 이 파일을 복사해
# .bumpversion.{서비스}.cfg + app/domain/{서비스}/version.py 를 만들고 build-on-main.yml SERVICES 에 추가한다.
[bumpversion]
current_version = 0.0.1
commit = True
tag = True
tag_name = job-{new_version}
message = 🚀 DEPLOY: job-{new_version} 배포

[bumpversion:file:app/domain/job/version.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
